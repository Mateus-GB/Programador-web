<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nutricionistas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: #f8f7f4;
      font-family: "Segoe UI", sans-serif;
    }
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 70px;
      height: 100vh;
      background: #2e7d32;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
    }
    .sidebar i, .sidebar img {
      font-size: 1.3rem;
      color: white;
      margin: 1rem 0;
      cursor: pointer;
    }
    .sidebar img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .content {
      margin-left: 90px;
      padding: 2rem;
    }
    h3 {
      font-weight: 600;
      color: #555;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-success {
      background: #2e7d32;
      border: none;
      border-radius: 6px;
    }
    .btn-danger {
      background: #b71c1c;
      border: none;
      border-radius: 6px;
    }
    .table thead {
      background: #f3f3f3;
      color: #555;
    }
    .table tbody tr {
      background: #f9f9f9;
    }
    .table td, .table th {
      vertical-align: middle;
    }
    .input-group-text {
      background: white;
      border-left: none;
    }
    .form-control {
      border-right: none;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <i class="bi bi-house-door"></i>
    <i class="bi bi-people"></i>
    <i class="bi bi-building"></i>
    <i class="bi bi-list-task"></i>
    <i class="bi bi-gear"></i>
    <div class="mt-auto">
      <img src="https://via.placeholder.com/40" alt="perfil">
    </div>
  </div>

  <div class="content">
    <h3 class="mb-4">Nutricionistas</h3>

    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="input-group w-50">
          <input type="text" id="buscar" class="form-control" placeholder="Nutricionistas..." aria-label="Buscar">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalForm">
          + Adicionar Nutricionista
        </button>
      </div>

      <div class="table-responsive">
        <table class="table align-middle text-center">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Instituição</th>
              <th>Contato</th>
              <th>Status</th>
              <th>Diário/Semanal</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaNutricionistas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formNutricionista">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel">Adicionar Nutricionista</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editIndex">
            <input type="text" class="form-control mb-2" id="nome" placeholder="Nome" required>
            <input type="text" class="form-control mb-2" id="instituicao" placeholder="Instituição" required>
            <input type="text" class="form-control mb-2" id="contato" placeholder="Contato" required>

            <!-- Novos campos -->
            <select class="form-control mb-2" id="status" required>
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
            <select class="form-control mb-2" id="frequencia" required>
              <option value="Diário">Diário</option>
              <option value="Semanal">Semanal</option>
            </select>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Importa o JS -->
  <script src="/Static/static/js/TabelaNutri.js"></script>
</body>
</html>
